name: Java CI Build

# Kích hoạt khi có sự kiện push và pull_request
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Lấy mã nguồn về máy ảo (Runner)
      - name: Checkout code
        uses: actions/checkout@v3

      # Bước 2: Cài đặt JDK 17 và cấu hình Cache để build nhanh hơn
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # Bước 3: Thực thi vòng đời build của Maven (chạy test và đóng gói jar)
      - name: Build with Maven
        run: mvn clean package

      # Bước 4: Lưu giữ tệp .jar vừa được tạo ra
      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v3
        with:
          name: calculator-app-jar
          path: target/*.jar